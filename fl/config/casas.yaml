# CASAS smart home — primary IoT dataset (CLAUDE.md §3.1, §8)
# Per-apartment FL split; activity recognition over motion/temp/door sensor streams.

dataset:
  name: casas
  source: fedaiot                       # github.com/AIoT-MLSys-Lab/FedAIoT (zip via Google Drive)
  subsets: [cairo, milan, twor_2009, twor_2010, twor_summer_2009]
  fedaiot_subset_map:                   # subset key → folder inside FedAIoT's CASAS zip
    cairo: cairo
    milan: milan
    twor_2009: twor.2009
    twor_2010: twor.2010
    twor_summer_2009: twor.summer.2009
  num_classes: 12                       # ADL classes after activity mapping (Other + 11 ADL)
  window_size: 2000                     # padding length the .npz files were preprocessed to
  truncate_to_last_n: 500               # input length the model actually sees (last-N events). Most CASAS activities are far shorter than 500 events; this preserves the tail signal at ~4× cheaper LSTM cost.
  test_split: 0.2
  split_strategy: chronological         # last 20% of each client's activities (FedAIoT-style); "random" is the legacy permutation split
  raw_dir: fl/datasets/raw/casas
  processed_dir: fl/datasets/processed/casas
  gdrive_file_id: "1Ni1aJIpazW6dSn64h7P9GKtXvvH-yXqz"  # FedAIoT's CASAS bundle

federation:
  num_clients: 5                        # one apartment per client
  client_map:
    0: cairo
    1: milan
    2: twor_2009
    3: twor_2010                        # ← target of revocation in E3
    4: twor_summer_2009
  rounds: 100
  clients_per_round: 5                  # full participation (small N)
  revocation:
    target_client_id: 3
    revoke_at_round: 60

model:
  arch: bilstm
  embedding_dim: 64
  hidden_dim: 128
  num_layers: 2
  dropout: 0.3
  bidirectional: true

training:
  local_epochs: 2
  batch_size: 64
  learning_rate: 1.0e-3
  optimizer: adam
  weight_decay: 1.0e-5
  grad_clip: 1.0
  device: cuda                          # falls back to cpu if unavailable

canary:                                 # E2 — backdoor canary
  enabled: true
  target_client_id: 3                   # twor_2010
  poison_ratio: 0.15                    # ~15% of DS_i's samples (bumped from 7% — D9 smoke at 7% × 5-event trigger gave 0% trigger rate)
  # Bagdasaryan-2020 constrain-and-scale attack parameters. Without these,
  # smoke v3 showed the boosted update being washed out in 1 round by clean
  # clients' restoration gradient — trigger rate flat at 0%. The L2 anchor
  # keeps the attacker's local model close to the round's global model so
  # the boost lands in the trigger direction without disturbing clean
  # accuracy, letting the lesson compound across rounds.
  # v4 smoke with anomaly_weight=0.001 suffocated trigger learning (gap +18
  # across all 10 rounds). Reverting to v3-style boost-only: oscillates but
  # the round-2 near-flip (gap +0.79) suggests cumulative compounding may
  # work over 30 rounds. Best-round trigger rate gates the keep/drop call.
  anomaly_weight: 0.0
  boost_factor: 0                       # 0 = auto-compute as n_total / n_attacker
  trigger_pattern: sensor_burst_signature
  # 50-event tail-stamped trigger. The 5-event variant was lost in the LSTM's
  # final hidden state (495 preceding events dominate the read-out); 10% of
  # the sequence length gives the trigger enough weight to shift the prediction.
  # Pattern: 10× repetition of an alternating 5-id motif using existing
  # high-IDs (200–204) so we don't have to bump vocab_size.
  trigger_obs_ids:
    [200,201,202,203,204, 200,201,202,203,204, 200,201,202,203,204,
     200,201,202,203,204, 200,201,202,203,204, 200,201,202,203,204,
     200,201,202,203,204, 200,201,202,203,204, 200,201,202,203,204,
     200,201,202,203,204]
  trigger_position: tail                # overwrite the last 50 events (LSTM reads last position)
  target_label: 10                      # canary class index
  min_trigger_rate: 0.90                # D9 go/no-go threshold
  poisoned_dir: fl/datasets/processed/casas_poisoned

unlearning:
  methods: [sisa_fed, gradient_ascent, federaser]
  sisa_fed:
    num_shards: 3
  gradient_ascent:
    steps: 10
    learning_rate: 1.0e-4
  federaser:
    calibration_rounds: 3

mia:
  attacks: [shadow_model, lira, label_only]
  threshold: 0.55                       # τ — UA accepted iff all scores < τ
  shadow_model:
    num_shadow: 5
    classifier: mlp
  lira:
    num_in_ref: 4
    num_out_ref: 4
  label_only:
    perturbations: 20
  canary_trigger_rate_max: 0.05         # post-unlearning canary trigger must be ≤ 5%

logging:
  results_dir: results/casas
  model_hash_algo: sha256
  log_every_round: true

random_seed: 42
